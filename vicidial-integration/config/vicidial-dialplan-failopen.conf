; =============================================================================
; VICIdial DID Optimizer — FAIL-OPEN DID selection context
;
; Guarantee: if our selection fails (API down, timeout, empty/invalid, or the
; placeholder fallback), we DO NOT touch CALLERID. VICIdial's own caller ID
; (whatever the campaign already set) stays in place and the call continues
; exactly as VICIdial would. Our script can never block or break a call.
;
;   - `timeout 3` caps our script at 3 seconds — it can never hang the dialer.
;   - `ExecIf(... ? Set(CALLERID...))` sets the DID ONLY on success; on
;     failure/default it runs nothing, so VICIdial's CID is left untouched.
;
; Requirement: configure the campaign with its NORMAL VICIdial Outbound Caller
; ID so there is always a valid CID present if our selection is skipped.
; =============================================================================

[did-optimizer]
exten => _X.,1,NoOp(=== DID Optimizer: ${EXTEN} campaign=${campaign} ===)
exten => _X.,n,System(timeout 3 /usr/share/astguiclient/vicidial-did-optimizer-config.pl "${campaign}" "${agent}" "${EXTEN}" > /tmp/did_${UNIQUEID} 2>/dev/null)
exten => _X.,n,Set(SELECTED_DID=${FILTER(0-9+,${FILE(/tmp/did_${UNIQUEID})})})
exten => _X.,n,System(rm -f /tmp/did_${UNIQUEID})
; Set caller ID ONLY if we got a real, non-placeholder DID. Otherwise do nothing
; -> VICIdial's existing caller ID is used.
exten => _X.,n,ExecIf($[${LEN(${SELECTED_DID})} >= 10 & "${SELECTED_DID}" != "+18005551234" & "${SELECTED_DID}" != "18005551234"]?Set(CALLERID(num)=${SELECTED_DID}))
exten => _X.,n,NoOp(DID Optimizer: SELECTED_DID='${SELECTED_DID}' caller_id_now='${CALLERID(num)}')
exten => _X.,n,Goto(vicidial-auto,${EXTEN},1)
